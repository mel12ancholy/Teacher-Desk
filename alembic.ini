# Alembic config (ASCII only: configparser reads ini with OS locale encoding on Windows)
# Daily usage (from project root):
#   alembic revision --autogenerate -m "message"   # generate migration after editing app/models.py
#   alembic upgrade head                            # apply migrations to database
#   alembic current / alembic history               # inspect versions
# NOTE: the database URL is NOT set here; alembic/env.py reads DATABASE_URL from the
# project .env at runtime (override temporarily with the ALEMBIC_DATABASE_URL env var,
# e.g. pointing to a test SQLite database).

[alembic]
script_location = alembic
prepend_sys_path = .
# set dynamically by env.py, keep empty
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
